
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Robot</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #1e293b;
}

.header {
    background: linear-gradient(135deg,#172554,#2563eb);
    color: white;
    text-align: center;
    padding: 30px 15px;
}

.header h1 {
    margin-bottom: 10px;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 15px;
}

.section {
    background: white;
    padding: 25px;
    border-radius: 15px;
}

.section h2 {
    color: #1e40af;
    margin-bottom: 25px;
}

form p {
    margin-bottom: 18px;
}

form label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input, textarea, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    min-height: 120px;
}

.errorlist {
    color: red;
}

.update-btn {
    width: 100%;
    padding: 16px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}

.back-btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    padding: 14px;
    background: #64748b;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

</style>

</head>

<body>

<div class="header">

<h1>🤖 Edit Robot</h1>

<p>Robot Management System</p>

<p>🔋 Update Robot Details</p>

</div>


<div class="container">

<div class="section">

<h2>⚙️ Update Robot Information</h2>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button class="update-btn" type="submit">

UPDATE ROBOT

</button>

</form>


<a class="back-btn" href="{% url 'robot_list' %}">

⬅ Back to Robot List

</a>

</div>

</div>


<div class="footer">

<p>Robot Management System</p>

<p>Developed with Python & Django</p>

</div>

</body>

</html>
