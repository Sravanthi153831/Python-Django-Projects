<!DOCTYPE html>
<html>
<head>
    <title>Robot Management</title>
</head>

<body>

<h1>Robot Management System 🤖</h1>

<h2>Add New Robot</h2>

<form method="POST" action="{% url 'robot_list' %}">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save Robot</button>

</form>

<hr>

<h2>Robot List</h2>

{% for robot in robots %}

    <h3>{{ robot.name }}</h3>

    <p>Robot Type: {{ robot.robot_type }}</p>

    <p>Description: {{ robot.description }}</p>

    <a href="{% url 'edit_robot' robot.id %}">
        Edit Robot
    </a>

    |

    <a href="{% url 'delete_robot' robot.id %}">
        Delete Robot
    </a>

    <hr>

{% empty %}

    <p>No Robots Available</p>

{% endfor %}

</body>
</html>
